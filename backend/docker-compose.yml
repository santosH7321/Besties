version: "3.9"

services:
  backend:
    build: .
    container_name: backend-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - mongodb
    volumes:
      - .:/app
    restart: always

  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

volumes:
  mongo-data: